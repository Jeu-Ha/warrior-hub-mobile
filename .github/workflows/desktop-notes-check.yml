name: Desktop Notes extension checks
on:
  push:
    branches: [notes-desktop-v5.19.59]
permissions:
  contents: read
jobs:
  extension:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --package-lock=false playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/desktop-auto-update.cjs
      - run: node tests/desktop-music.cjs
      - run: node tests/notes-desktop-extension.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-notes-results
          path: test-output/
