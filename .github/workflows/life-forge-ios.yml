name: Build Life Forge iPhone
on:
  push:
    branches: [life-forge-ios-build]
    paths: ['life-forge-ios/**', '.github/workflows/life-forge-ios.yml']
permissions:
  contents: read
jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build device app and widget extension
        run: >-
          xcodebuild -project life-forge-ios/LifeForge.xcodeproj -scheme LifeForge
          -configuration Release -destination 'generic/platform=iOS'
          -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - name: Package unsigned IPA for local Apple ID signing
        run: |
          mkdir -p package/Payload
          cp -R build/Build/Products/Release-iphoneos/LifeForge.app package/Payload/
          cd package
          zip -qry Life-Forge-iPhone-1.10-unsigned.ipa Payload
      - name: Verify both bundled widget modules
        run: |
          python3 - <<'PY'
          import pathlib, plistlib
          root = pathlib.Path("build/Build/Products/Release-iphoneos/LifeForge.app")
          app = plistlib.load((root/"Info.plist").open("rb"))
          for name in ["LiveTimer", "ForgeWidgets"]:
              path = root/"PlugIns"/(name+".appex")
              info = plistlib.load((path/"Info.plist").open("rb"))
              assert info["CFBundleIdentifier"].startswith(app["CFBundleIdentifier"]+".")
              assert info["CFBundleShortVersionString"] == app["CFBundleShortVersionString"] == "1.10"
              assert info["NSExtension"]["NSExtensionPointIdentifier"] == "com.apple.widgetkit-extension"
              assert (path/info["CFBundleExecutable"]).stat().st_size > 0
          print("Device IPA: both WidgetKit modules validated")
          PY
      - name: Build and render native philosophy cards on iPhone simulator
        run: |
          xcodebuild -project life-forge-ios/LifeForge.xcodeproj -scheme LifeForge -configuration Release -destination 'generic/platform=iOS Simulator' -derivedDataPath sim-build CODE_SIGNING_ALLOWED=NO build > simulator-build.log 2>&1 || { tail -100 simulator-build.log; exit 1; }
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys;d=json.load(sys.stdin);print(next(x["udid"] for k,v in d["devices"].items() if ".iOS-" in k for x in v if x["name"].startswith("iPhone")))')
          xcrun simctl boot "$DEVICE" || true
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl install "$DEVICE" sim-build/Build/Products/Release-iphonesimulator/LifeForge.app
          xcrun simctl launch "$DEVICE" com.jeuha.LifeForge --widget-preview
          sleep 8
          xcrun simctl io "$DEVICE" screenshot widget-preview.png
      - uses: actions/upload-artifact@v4
        with:
          name: Life-Forge-iPhone-1.10-unsigned
          path: |
            package/Life-Forge-iPhone-1.10-unsigned.ipa
            widget-preview.png
          retention-days: 14
