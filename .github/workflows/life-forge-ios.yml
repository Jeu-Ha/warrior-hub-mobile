name: Build Life Forge iPhone
on:
  push:
    branches: [life-forge-ios-build]
    paths: ['life-forge-ios/**', '.github/workflows/life-forge-ios.yml']
permissions:
  contents: read
jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build device app and widget extension
        run: >-
          xcodebuild -project life-forge-ios/LifeForge.xcodeproj -scheme LifeForge
          -configuration Release -destination 'generic/platform=iOS'
          -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - name: Package unsigned IPA for local Apple ID signing
        run: |
          mkdir -p package/Payload
          cp -R build/Build/Products/Release-iphoneos/LifeForge.app package/Payload/
          cd package
          zip -qry Life-Forge-iPhone-1.4-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Life-Forge-iPhone-1.4-unsigned
          path: package/Life-Forge-iPhone-1.4-unsigned.ipa
          retention-days: 14
