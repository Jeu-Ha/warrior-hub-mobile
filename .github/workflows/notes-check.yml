name: Notes browser checks
on:
  push:
    branches: [main, notes-mode-v0.9]
  pull_request:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --package-lock=false playwright@1.62.1
      - run: npx playwright install --with-deps chromium webkit
      - run: node --check app.js && node --check service-worker.js
      - run: node tests/regression.cjs
      - run: node tests/notes-browser.cjs
      - if: success() || failure()
        run: node tests/notes-sync.cjs
      - if: success() || failure()
        run: NOTES_WEBKIT=1 node tests/notes-browser.cjs
      - if: success() || failure()
        run: NOTES_WEBKIT=1 node tests/notes-sync.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: notes-screenshots
          path: test-output/
